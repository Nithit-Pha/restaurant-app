name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:

jobs:
  server:
    name: Server · type-check + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test

  client:
    name: Client · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  e2e:
    name: End-to-end · order flow
    runs-on: ubuntu-latest
    needs: [server, client]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: restaurant
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: restaurant_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U restaurant"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://restaurant:secret@localhost:5432/restaurant_db
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      CLIENT_URL: http://localhost:5173
      API_ORIGIN: http://localhost:3001
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start the API
        working-directory: server
        run: |
          npm ci
          npx prisma migrate deploy
          npm run db:seed
          npm run build
          nohup node dist/server.js > ../api.log 2>&1 &

      - name: Start the website
        working-directory: client
        run: |
          npm ci
          npm run build
          nohup npm start > ../web.log 2>&1 &

      - name: Wait until both answer
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/health > /dev/null && curl -sf http://localhost:5173 > /dev/null && exit 0
            sleep 2
          done
          echo "App did not start"; cat api.log web.log; exit 1

      - name: Run Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - name: Upload report and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            api.log
            web.log
